version: '3'

tasks:
  build:frontend:
    summary: Build the frontend
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
    generates:
      - dist/**/*
    cmds:
      - npm run build -q

  darwin:build:
    summary: Build macOS application (Go binary + Python sidecar)
    deps:
      - task: build:frontend
    cmds:
      # -a forces rebuilding all packages. Without this, Go's build cache may
      # serve a stale //go:embed all:frontend/dist snapshot when only the dist
      # contents changed (vite hashes file names, so the embed file set changes
      # but Go's cache key can miss it). This is the #1 cause of "I rebuilt but
      # the UI didn't change" bugs.
      - go build -a -o build/quantflow .
      # Copy Python sidecar source to build/python/ so StartSidecar can
      # find it at runtime (it looks for python/ relative to the binary).
      # Exclude: venv (binaries), __pycache__, tests, and hidden dirs.
      - rsync -a --delete
        --exclude='.venv/'
        --exclude='__pycache__/'
        --exclude='*.pyc'
        --exclude='tests/'
        --exclude='.DS_Store'
        python/ build/python/
      # Symlink the source venv so the sidecar has its dependencies.
      # If the symlink already exists, ln -sf replaces it silently.
      - test -d python/.venv && ln -sfn "$(pwd)/python/.venv" build/python/.venv || true
