version: '3'

tasks:
  python:deps:
    summary: Compile Python dependencies
    dir: python
    cmds:
      - pip-compile pyproject.toml --output-file=requirements.lock

  proto:
    summary: Regenerate gRPC code from .proto files
    cmds:
      - |
        cd python && python -m grpc_tools.protoc \
          -I proto \
          --python_out=src/proto \
          --grpc_python_out=src/proto \
          proto/*.proto
      - |
        protoc --go_out=. --go_opt=module=quantflow --go-grpc_out=. --go-grpc_opt=module=quantflow \
          -I python/proto \
          python/proto/*.proto
      - echo "Proto generated"

  build:frontend:
  build:frontend:
    summary: Build the frontend
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
    generates:
      - dist/**/*
    cmds:
      - npm run build -q

  darwin:build:
    summary: Build macOS application (Go binary + Python sidecar)
    deps:
      - task: build:frontend
    cmds:
      # -a forces rebuilding all packages. Without this, Go's build cache may
      # serve a stale //go:embed all:frontend/dist snapshot when only the dist
      # contents changed (vite hashes file names, so the embed file set changes
      # but Go's cache key can miss it). This is the #1 cause of "I rebuilt but
      # the UI didn't change" bugs.
      - go build -a -o build/quantflow .
      # Copy Python sidecar source to build/python/ so StartSidecar can
      # find it at runtime (it looks for python/ relative to the binary).
      # Exclude: venv (binaries), __pycache__, tests, and hidden dirs.
      - rsync -a --delete
        --exclude='.venv/'
        --exclude='__pycache__/'
        --exclude='*.pyc'
        --exclude='tests/'
        --exclude='.DS_Store'
        python/ build/python/
      # Symlink the source venv so the sidecar has its dependencies.
      # rsync --delete with --exclude skips .venv/ in both source and dest,
      # so we create the symlink AFTER rsync to ensure it survives.
      - ln -sfn "$(pwd)/python/.venv" build/python/.venv
      # Package as .app bundle so double-click doesn't open Terminal
      - mkdir -p build/quantflow.app/Contents/MacOS
      - cp build/quantflow build/quantflow.app/Contents/MacOS/quantflow
      # Symlink python/ so os.Executable()-relative resolution finds the sidecar
      - ln -sfn ../../../python build/quantflow.app/Contents/MacOS/python
      - |
        if [ ! -f build/quantflow.app/Contents/Info.plist ]; then
          cat > build/quantflow.app/Contents/Info.plist <<'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleExecutable</key>
          <string>quantflow</string>
          <key>CFBundleIdentifier</key>
          <string>com.quantflow.app</string>
          <key>CFBundleName</key>
          <string>QuantFlow</string>
          <key>CFBundleVersion</key>
          <string>1.0</string>
          <key>CFBundlePackageType</key>
          <string>APPL</string>
        </dict>
        </plist>
        PLIST
        fi
