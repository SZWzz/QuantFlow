[project]
name = "quantflow-python"
version = "0.2.2"
description = "QuantFlow Python gRPC Sidecar"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "protobuf>=4.25",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "torch>=2.1",
    "gplearn>=0.4",
    "gymnasium>=0.29",
    "arch>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
]
# Optional: enables the mootdx (TDX 通达信 TCP) A-share data source via the
# Python sidecar. The core app works without it — when absent, the MootdxAdapter
# reports IsAvailable()==false and the CN fallback chain skips to the next source.
# Install with: pip install -e ".[data]"
data = [
    "mootdx>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
