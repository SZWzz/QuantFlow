[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "quantflow-python"
version = "0.2.3"
description = "QuantFlow Python gRPC Sidecar"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "protobuf>=4.25",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "gplearn>=0.4",
    "gymnasium>=0.29",
    "arch>=6.0",
    "akshare>=1.14.0",
    "ccxt>=4.0",
    "yfinance>=0.2",
    "edgartools>=0.5.0",
    "nltk>=3.8",
    "snownlp>=0.12.3",
    "textblob>=0.17",
    "jieba>=0.42",
    "scipy>=1.11",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
data = [
    "akshare>=1.14.0",
    "ccxt>=4.0",
    "yfinance>=0.2",
    "edgartools>=0.5.0",
    "mootdx>=0.9",
]
ml = [
    "torch>=2.1,<3",
]
nlp = [
    "nltk>=3.8",
    "snownlp>=0.12.3",
    "textblob>=0.17",
    "jieba>=0.42",
]
stats = [
    "scipy>=1.11",
    "statsmodels>=0.14",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.12"
warn_unused_configs = true
