syntax = "proto3";

package quantflow;

option go_package = "quantflow/internal/python/proto;proto";

// FactorService provides alpha factor computation capabilities.
// Factors are computed in Python using pandas/numpy and returned as protobuf messages.
service FactorService {
  // Compute a single factor for a universe of symbols.
  rpc ComputeFactor(ComputeFactorRequest) returns (ComputeFactorResponse);

  // Compute multiple factors in one batch call.
  rpc ComputeFactorBatch(ComputeFactorBatchRequest) returns (ComputeFactorBatchResponse);

  // List all available factors with metadata.
  rpc ListFactors(ListFactorsRequest) returns (ListFactorsResponse);
}

message ComputeFactorRequest {
  string factor_name = 1;
  repeated string symbols = 2;
  string start_date = 3;
  string end_date = 4;
  map<string, string> params = 5;
  bytes ohlcv_data = 6;              // Arrow IPC bytes (zero-copy DataFrame transfer)
}

message FactorResult {
  string symbol = 1;
  repeated string dates = 2;
  repeated double values = 3;
}

message ComputeFactorResponse {
  string factor_name = 1;
  repeated FactorResult results = 2;
  int64 compute_time_ms = 3;
  string error = 4;
}

message ComputeFactorBatchRequest {
  repeated string factor_names = 1;
  repeated string symbols = 2;
  string start_date = 3;
  string end_date = 4;
  map<string, string> params = 5;
  bytes ohlcv_data = 6;
}

message ComputeFactorBatchResponse {
  repeated ComputeFactorResponse factor_responses = 1;
  int64 total_compute_time_ms = 2;
}

message FactorMeta {
  string name = 1;
  string category = 2;
  string description = 3;
  map<string, string> default_params = 4;
}

message ListFactorsRequest {}

message ListFactorsResponse {
  repeated FactorMeta factors = 1;
}
