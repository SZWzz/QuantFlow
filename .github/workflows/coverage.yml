name: Coverage Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]

  workflow_dispatch:

jobs:
  backend-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Create frontend/dist placeholder for go:embed
        run: mkdir -p frontend/dist && echo '<!doctype html><title>ci-placeholder</title>' > frontend/dist/index.html

      - name: Run tests with coverage
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Check coverage threshold (ratchet baseline 38%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          # Ratchet 基线：2026-08-29 实测总覆盖率 38.5%（根包 Wails 绑定层 app_*.go 仅 4.5% 拖低，
          # internal/* 约 43%）。阈值只许上调不许下调，随测试补充逐步抬升，目标 60%。
          THRESHOLD=38
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"

  frontend-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run tests with coverage
        run: npx vitest run --coverage
        working-directory: frontend
