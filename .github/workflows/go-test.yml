name: Go Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run tests with shuffle
        working-directory: .
        run: go test ./... -shuffle=on -count=1 -v 2>&1 | tail -100

      - name: Goroutine leak check (critical paths)
        working-directory: .
        run: |
          go test -race -count=1 ./internal/ws/ ./internal/market/ ./internal/workflow/ 2>&1 | tail -50
