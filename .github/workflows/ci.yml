name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      # Wails v3 webview 在 Linux 上通过 CGO 链接 GTK4/WebKitGTK，ubuntu runner 需先装系统库
      - name: Install GTK4/WebKitGTK system deps (Wails v3)
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      # main.go embeds all:frontend/dist — create a placeholder so the backend
      # job can compile without a full frontend build (real assets ship via the
      # frontend job / release pipeline).
      - run: mkdir -p frontend/dist && echo '<!doctype html><title>ci-placeholder</title>' > frontend/dist/index.html
      - run: go build ./...
      - run: go vet ./...
      # 版本与 .golangci.yml(v1 配置格式）及本地门禁保持一致
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - run: golangci-lint run ./... --timeout 5m
      - run: go test -race ./... -count=1
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
      - run: cd frontend && npm ci
      - run: cd frontend && npx vue-tsc --noEmit
      - run: cd frontend && npm run build -q
      - run: cd frontend && npx vitest run --bail=5
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('python/pyproject.toml') }}
      - run: cd python && pip install -e ".[dev,data]"
      - run: cd python && python -m pytest tests/ -x -q
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-e2e-${{ hashFiles('frontend/package-lock.json') }}
      - run: cd frontend && npm ci
      - run: cd frontend && npx playwright install chromium --with-deps
      - run: cd frontend && npx playwright test --config e2e/playwright.config.ts
        timeout-minutes: 10
