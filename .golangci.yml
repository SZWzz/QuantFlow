linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - bodyclose
    - gosimple
    - ineffassign
    - unused
    - misspell
linters-settings:
  errcheck:
    exclude-functions:
      - io.ReadAll
      - io.Copy
issues:
  exclude-rules:
    - path: _test\.go
      linters: [errcheck]
