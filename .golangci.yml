run:
  timeout: 5m

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - bodyclose
    - gosimple
    - ineffassign
    - unused
    - misspell
    - gofumpt
    - gocyclo
    - revive
    - goconst
    - gocritic
    - gosec
linters-settings:
  errcheck:
    exclude-functions:
      - io.ReadAll
      - io.Copy
issues:
  exclude-rules:
    - path: _test\.go
      linters: [errcheck]
