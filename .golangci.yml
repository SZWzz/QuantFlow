run:
  timeout: 5m

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - bodyclose
    - gosimple
    - ineffassign
    - unused
    - misspell
    - gofumpt
    - gocyclo
    - gocritic
    - gosec
    # Ratchet 说明（2026-08-29）：以下两个风格类 linter 各有 50 条存量告警
    # （revive=导出符号缺注释，goconst=重复字符串字面量），修复收益低、噪音大，
    # 暂时移除；后续补注释/抽常量时再加回。
    # - revive
    # - goconst
linters-settings:
  errcheck:
    exclude-functions:
      - io.ReadAll
      - io.Copy
issues:
  exclude-dirs:
    - frontend/node_modules
    - frontend/dist
    - .claude
  exclude-rules:
    - path: _test\.go
      linters: [errcheck]
